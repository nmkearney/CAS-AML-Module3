[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "chatcde"
version = "0.1.0"
description = "Local research assistant over the publications of CDE, University of Bern (prototype)."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Norman Kearney" }, { name = "Simon Bader" }]
dependencies = [
    "typer>=0.15",    # CLI; sub-apps per subpackage, rich help
    "rich>=13",       # console log handler and tables
    "pydantic>=2.7",  # config validation; shared schemas
    "pyyaml>=6",      # config and vocabulary YAML
    "duckdb>=1.1",    # catalogue (data/catalogue.duckdb) and the test fixture DB
    "httpx>=0.27",    # BORIS and OpenAlex APIs
    "certifi",        # python.org builds on macOS lack root certificates
    "numpy>=1.26",    # label clustering in `vocab extract` (decision 0019)
    "pymupdf>=1.24",  # PDF text and page rendering (chatcde parse, decision 0014)
    "lingua-language-detector>=2.0",  # offline language per page (decision 0014)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff==0.17.3",   # exact pin: local and CI must format identically
]
# Only for rebuilding tests/fixtures/ from BORIS (scripts/fetch_fixture_records.py).
# PyMuPDF, which it needs, is now a main dependency.
fixtures = []

[project.scripts]
chatcde = "chatcde.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chatcde"]

# --- Ruff -----------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]
# TODO(#2): schemas.py is the draft contract; issue #2 formats it, settles
# str+Enum vs StrEnum (UP042) and removes this exclusion.
extend-exclude = ["src/chatcde/schemas.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]

# --- Pytest ---------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not network'"
# PyMuPDF's SWIG bindings warn on import under Python 3.12+; not our code.
filterwarnings = [
    "ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__:DeprecationWarning",
]
markers = [
    "network: needs network access (BORIS, OpenAlex, GPUStack); deselected by default",
]
