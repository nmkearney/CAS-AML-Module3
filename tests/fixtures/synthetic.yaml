      This synthetic working paper reports how researchers and members of three
      urban gardening initiatives in Bern co-designed a living lab. Together they
      ran visioning workshops and agreed on shared rules for the use of green space.
      The gardeners were co-researchers throughout. The paper reflects on power
      relations between the university and grassroots initiatives.
