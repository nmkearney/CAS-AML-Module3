# ChatCDE default configuration.
# Users override values in a local file (e.g. ~/.config/chatcde/config.yaml);
# never commit secrets such as API keys. Values marked TODO are placeholders.

version: 1

# --- Local LLM endpoint (OpenAI-compatible: GPUStack, vLLM or Ollama) --------
llm:
  base_url: "https://gpustack.unibe.ch/v1"
  api_key_env: "CHATCDE_LLM_API_KEY"                 # read from this env variable
  timeout_s: 120
  max_concurrency: 4             # measured 2026-11-06: throughput collapses at 8 (0003)
  rerank_path: "/rerank"         # appended to base_url; reranking is not in the OpenAI API

# Models by role; candidates are compared with `chatcde evaluate`.
# See docs/decisions/0003-models-by-role.md. Check them with scripts/check_gpustack.py.
models:
  agent: "gpt-oss-120b"
  tagging: "qwen3.8-27b"
  embedding: "qwen3-embedding-4b"
  reranker: "jina-reranker-v2-base-multilingual"
  vision: "qwen3-vl-30b-a3b-instruct"    # scanned pages, figures
  speech: "faster-whisper-large-v3"      # optional: audiovisual records

# Second choice for each role (null = none), compared with the first choice.
model_alternatives:
  agent: "qwen3.8-27b"           # minimax-m2.7 is not served on GPUStack (2026-11-06)
  tagging: "lfm2.5-24b-a2b"
  embedding: "granite-embedding-107m-multilingual"
  reranker: null
  vision: "internvl3-8b-instruct"
  speech: null

# --- Sources -------------------------------------------------------------
boris:
  api_base: "https://boris-portal.unibe.ch/server/api"  # UniBe network / VPN only
  cde_query: '"Centre for Development and Environment"'
  request_delay_s: 0.3          # pause before every request; never parallel
  page_size: 100                # search results per page
  sort: "dc.date.accessioned,ASC"  # fixed order so pages stay stable while resuming
  timeout_s: 60
  download_timeout_s: 300       # per file download (some PDFs are large)
  max_retries: 3                # on timeouts and 5xx, with growing back-off
openalex:                       # public API; no VPN needed (decision 0010)
  api_base: "https://api.openalex.org"
  api_key_env: "CHATCDE_OPENALEX_API_KEY"  # optional free key; keyless budget suffices
  mailto: ""                    # optional contact email, sent only if set
  request_delay_s: 0.2          # pause before every request; never parallel
  batch_size: 100               # DOIs per request (OpenAlex allows up to 100)
  timeout_s: 60
  max_retries: 3                # on timeouts, 429 and 5xx, with growing back-off
  min_abstract_words: 30        # shorter OpenAlex abstracts are rejected as junk
  # OA links on these hosts or DOI prefixes point back to BORIS (all three
  # prefixes are BORIS's own DataCite DOIs, checked 2026-11-07).
  boris_hosts: ["boris.unibe.ch", "boris-portal.unibe.ch"]
  boris_doi_prefixes: ["10.7892/", "10.48350/", "10.48620/"]

# --- Data bundles (see docs/decisions/0004-two-data-editions.md) ----------
data:
  dir: "data"
  raw_dir: "data/raw"            # cached source JSON and files (harvest)
  files_dir: "data/raw/files"    # one main PDF per record: <record_id>.pdf (0009)
  text_dir: "data/text"          # parse summary and the OCR cache (0014)
  catalogue: "data/catalogue.duckdb"
  editions:
    full:
      # Hosted on CDE's server, reachable only from the UniBe network / VPN.
      url: "https://cde-server.example.unibe.ch/chatcde/bundles/"  # TODO: real location
      probe_timeout_s: 5
    open:
      url: "https://github.com/nmkearney/CAS-AML-Module3/releases/download/"  # TODO: confirm
  default_edition: "auto"        # auto = try full, fall back to open

# --- Parsing PDFs (see docs/decisions/0014-parsing.md) ---------------------
# Each page is classed as text / ocr / garbled / blank. "ocr" and "garbled" pages
# are rendered and transcribed by the `vision` model.
parse:
  min_chars: 50                  # fewer non-space characters = "low text"
  min_image_coverage: 0.2        # low text + images over this share of the page -> ocr
  min_drawings: 200              # low text + this many vector paths (outlined text) -> ocr
  max_garbage_ratio: 0.05        # share of U+FFFD / private-use / (cid:NN) chars -> garbled
  min_alnum_ratio: 0.5           # letters+digits among non-space, non-punctuation chars -> garbled
  ocr_prompt: "ocr_page.v1"      # file <prompts.dir>/<ocr_prompt>.md
  ocr_dpi: 150                   # render resolution for the vision model
  ocr_max_px: 2000               # cap on the longer side of the rendered image
  ocr_max_tokens: 4096           # answer budget per page; hitting it counts as a failure
  ocr_retry_repetition_penalty: 1.05  # cut-off answers are loops: retry once with this (vLLM)
  ocr_reject_scripts: ["THAI"]   # qwen3-vl writes Lao pages as Thai; no record is in Thai
  max_retries: 3                 # on timeouts, 429 and 5xx, with growing back-off
  max_consecutive_failures: 5    # stop the OCR pass if the endpoint keeps failing
  languages: ["en", "de", "fr", "es", "it", "pt"]  # candidates for language detection
  min_chars_language: 40         # shorter pages get language null
  min_language_confidence: 0.5   # less confident detections give null
  language_sample_chars: 2000    # detect on the first N characters of a page

# --- Vocabulary and prompts ---------------------------------------------
vocab:
  file: "vocab/draft_vocabulary.yaml"
  version: "0.2"
prompts:
  dir: "src/chatcde/prompts"

# --- Open extraction for vocabulary drafting (docs/decisions/0019-open-extraction.md)
# `chatcde vocab extract`: sample -> label (LLM, models.tagging) -> propose
# (embeddings + clustering + LLM) -> vocab/candidates.yaml for curation.
vocab_extract:
  sample_size: 250               # target number of records
  stratum_floor: 3               # every non-empty unit x decade x language stratum gets this many
  seed: 13                       # random seed for the draw; change it for a new sample
  pool_before: 2000              # years before this form one "<2000" decade stratum
  languages: ["en", "de"]        # own language strata; all others are pooled as "other"
  max_fulltext_chars: 6000       # characters of parsed page text given to the model
  max_input_chars: 12000         # cap on the whole input (title + abstract + pages)
  labels_per_kind: 6             # at most this many labels per kind and record
  max_tokens: 2048               # answer budget per record
  max_consecutive_failures: 5    # stop if the endpoint keeps failing
  extract_prompt: "vocab_extract.v1"   # file <prompts.dir>/<name>.md
  propose_prompt: "vocab_propose.v2"   # v2: short notes, only when actionable (0019)
  cluster_threshold: 0.80        # average-linkage cosine similarity at which merging stops
  min_records: 3                 # clusters seen in fewer records are listed as unclustered
  example_labels: 12             # member labels shown per candidate
  example_records: 5             # record IDs shown per candidate
  output: "vocab/candidates.yaml"
  sample_csv: "data/vocab/sample.csv"
  # Extra request fields for models.tagging; qwen3 thinks unless told not to (0003).
  extra_body:
    chat_template_kwargs: {enable_thinking: false}

# --- Retrieval ------------------------------------------------------------
retrieval:
  chunk_tokens: 500              # fits the reranker's 1K context
  chunk_overlap_tokens: 50
  tokens_per_word: 1.4           # token estimate per word/punctuation piece (0011)
  top_k: 40                      # candidates per retriever (BM25, vectors) and after fusion
  top_n: 8                       # passages returned after reranking
  # Hybrid search (docs/decisions/0013-hybrid-search.md)
  rrf_k: 60                      # reciprocal rank fusion: score = sum 1 / (rrf_k + rank)
  rerank: true                   # rerank the fused candidates with models.reranker
  rerank_max_chars: 2000         # cut each passage to fit the reranker's 1K-token context
  bm25_k1: 1.2                   # BM25 term-frequency saturation
  bm25_b: 0.75                   # BM25 length normalisation

# --- Embeddings (see docs/decisions/0012-embeddings.md) ---------------------
embedding:
  batch_size: 32                 # chunks per /embeddings request
  dimensions: 1024               # truncate (Matryoshka) and renormalise; null = full size
  include_title: true            # embed "title + chunk text" for documents
  max_retries: 3                 # on timeouts, 429 and 5xx, with growing back-off
  query_instructions:            # per model; models not listed embed the bare query
    qwen3-embedding-4b: "Given a question about research publications, retrieve passages that answer it"

# --- Evaluation -----------------------------------------------------------
evaluation:
  reference_set: "data/reference/reference_tags.yaml"
  questions: "tests/questions.yaml"
  min_precision: 0.7             # TODO: set and justify in a decision record

# --- Logging --------------------------------------------------------------
# Console logs go to stderr (stdout stays clean for results); -v / -q on the
# command line override `level`. Set `file` to null to turn off the log file.
logging:
  level: "INFO"                  # console level
  file: "data/logs/chatcde.log"  # plain-text log, rotated
  file_level: "DEBUG"
  max_bytes: 5000000
  backup_count: 3
