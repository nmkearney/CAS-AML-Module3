data_type:
  candidates:
  - label: Land cover and use data
    definition: Geospatial datasets, maps, or raster/vector layers describing the physical cover of the
      land surface (e.g., vegetation, water, built-up areas) or its anthropogenic use (e.g., agriculture,
      forestry, urban). Includes historical, current, or projected states and changes.
    action: split_existing
    existing_term: Secondary geospatial
    suggested_dimension: data_type
    note: The cluster consists almost entirely of specific thematic geospatial data (land cover/use).
      While 'Secondary geospatial' is a valid broad category, creating a specific term for land cover/use
      allows for better granularity in analyzing CDE's focus on land systems. If the vocabulary prefers
      to keep only broad data types, this could be merged into 'Secondary geospatial', but 'split_existing'
      is proposed to capture the specific thematic focus evident in the labels.
