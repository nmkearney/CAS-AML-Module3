  - label: Satellite imagery
    definition: Geospatial data derived from optical or radar sensors mounted on satellites, including
      specific platforms like Landsat and MODIS, as well as commercial high-resolution imagery. This term
      covers raw images and derived indicators but excludes ground-based remote sensing or non-satellite
      aerial photography.
    action: split_existing
    existing_term: Secondary geospatial
    suggested_dimension: data_type
    note: The cluster specifically highlights satellite-derived data. While 'Secondary geospatial' is
      a valid category, 'Satellite imagery' is a distinct and frequently used data type in CDE research
      that warrants its own term for better granularity and searchability, distinguishing it from other
      secondary geospatial sources like GIS layers or maps.
