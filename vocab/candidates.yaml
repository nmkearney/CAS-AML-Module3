      sources for analysis or as the subject of the study. This includes national and international policy
      frameworks (e.g., Agenda 2030) and specific sectoral strategies.
    action: merge_into_existing
    existing_term: Documents and policies
    suggested_dimension: data_type
    note: The cluster specifically highlights policy-related texts. The existing term 'Documents and policies'
      is broad enough to cover this, but the label 'Policy documents' is more precise for this specific
      subset if the curator wishes to distinguish them from general 'documents' (like news articles or
      non-policy reports). However, given the existing term already includes 'policies', merging is the
      most logical step to maintain a concise vocabulary, potentially refining the definition of the existing
      term to explicitly include 'policy literature'.
