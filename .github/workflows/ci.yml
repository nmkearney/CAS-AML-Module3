# Runs linting and tests on every pull request and on pushes to main.
# The job "ci" (which waits for every Python version) is the required status check.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest -q
      - name: CLI smoke test
        run: chatcde --help

  ci:
    # Single, stable check name for branch protection, whatever the matrix.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "All Python versions passed."
