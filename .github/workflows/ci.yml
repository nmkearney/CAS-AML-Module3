# Runs linting and tests on every pull request and on pushes to main.
# The job name "ci" is what you select as a required status check.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; else pip install ruff pytest pydantic pyyaml; fi
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: |
          if [ -d tests ]; then pytest -q; else echo "No tests yet"; fi
